databases:
  - name: coaching-logbuch-db
    plan: basic-256mb
    databaseName: coaching_logbuch
    user: coaching_logbuch

services:
  - type: web
    name: coaching-logbuch
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: coaching-logbuch-db
          property: connectionString
